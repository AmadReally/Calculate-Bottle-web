<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6D2312">
  <title>Kira Botol Terengganu</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/barlow-semi-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabs" aria-label="Utama">
      <a href="#/kira" data-tab="kira">Kira</a>
      <a href="#/jumlah" data-tab="jumlah">Jumlah</a>
      <a href="#/hasil" data-tab="hasil">Hasil</a>
      <a href="#/berita" data-tab="berita">Berita</a>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="confirm">
    <form method="dialog">
      <p id="confirm-text"></p>
      <div class="row-end">
        <button value="cancel" class="btn">Batal</button>
        <button value="ok" class="btn btn-solid">Padam</button>
      </div>
    </form>
  </dialog>

  <dialog id="login-dlg" aria-labelledby="login-h">
    <form id="login" method="dialog" novalidate>
      <h2 id="login-h">Log masuk untuk simpan</h2>
      <p class="hint" id="l-hint">Kiraan boleh dibuat tanpa akaun. Menyimpan rekod perlukan akaun penyumbang; minta daripada pentadbir projek.</p>
      <div class="field" id="l-invite-field" hidden>
        <label for="l-invite">Kod jemputan</label>
        <input id="l-invite" name="invite" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="200">
      </div>
      <div class="field">
        <label for="l-user">Nama pengguna</label>
        <input id="l-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required>
        <span class="hint" id="l-user-hint" hidden>3–32 aksara: huruf kecil, nombor, titik, sengkang atau garis bawah.</span>
      </div>
      <div class="field">
        <label for="l-pass">Kata laluan</label>
        <input id="l-pass" name="password" type="password" autocomplete="current-password" maxlength="200" required>
        <span class="hint" id="l-pass-hint" hidden>Sekurang-kurangnya 10 aksara.</span>
      </div>
      <p class="error" id="l-err" role="alert"></p>
      <p><button type="button" class="btn btn-text" id="l-mode" hidden>Belum ada akaun? Daftar dengan kod jemputan</button></p>
      <div class="row-end">
        <button type="button" class="btn" id="login-cancel">Batal</button>
        <button type="submit" class="btn btn-solid" id="l-submit">Log masuk</button>
      </div>
    </form>
  </dialog>
</body>
</html>
